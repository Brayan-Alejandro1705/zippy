name: Build iOS

# Compila ZIPPYGO para iPhone y la sube a TestFlight.
#
# Corre en un Mac que presta GitHub, asi que no hace falta tener un Mac propio.
# A diferencia del de Android, este NO se dispara solo en cada push: se lanza a
# mano desde la pestana Actions, porque cada version de iOS pasa por revision de
# Apple y no tiene sentido generar una por cada commit.
#
# Secrets que necesita (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID                  Team ID de la cuenta de desarrollador (10 caracteres)
#   IOS_DIST_P12_BASE64            Certificado de distribucion (.p12) en base64
#   IOS_DIST_P12_PASSWORD          Contrasena de ese .p12
#   IOS_PROVISION_PROFILE_BASE64   Perfil de aprovisionamiento App Store en base64
#   APPSTORE_API_KEY_P8_BASE64     Llave .p8 de App Store Connect en base64
#   APPSTORE_API_KEY_ID            Key ID de esa llave
#   APPSTORE_API_ISSUER_ID         Issuer ID de App Store Connect
#   GOOGLE_MAPS_KEY                (ya existe, lo comparte con el build de Android)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci || npm install

      - name: Compilar la app React
        working-directory: frontend
        run: npm run build
        env:
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'
          REACT_APP_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

      # CAP_BUNDLED=1 le dice a capacitor.config.ts que NO use server.url, para
      # que el frontend quede empaquetado dentro de la app. Apple rechaza las
      # apps que cargan toda su interfaz desde un servidor web.
      - name: Generar el proyecto iOS
        working-directory: frontend
        env:
          CAP_BUNDLED: '1'
        run: |
          set -e
          npx cap add ios
          npx cap sync ios
          cd ios/App
          # Segun la version, Capacitor arma el proyecto con CocoaPods (deja un
          # .xcworkspace) o con Swift Package Manager (solo .xcodeproj). Si hay
          # Podfile pero no quedo el workspace, se corren los pods a mano.
          if [ -f Podfile ] && [ ! -d App.xcworkspace ]; then
            pod install
          fi
          echo "--- contenido de ios/App ---"
          ls -la
          echo "--- schemes disponibles ---"
          xcodebuild -list -project App.xcodeproj || true

      # La app pide ubicacion (mapa y seguimiento del pedido) y fotos (imagenes
      # de los productos). En iOS, si el permiso no esta declarado con su
      # explicacion, la app se cierra sola al pedirlo y Apple la rechaza.
      - name: Declarar los permisos en el Info.plist
        working-directory: frontend/ios/App/App
        run: |
          set -e
          poner() {
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" Info.plist 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $2" Info.plist
          }
          poner NSLocationWhenInUseUsageDescription "ZIPPYGO usa tu ubicacion para mostrarte los negocios cerca y para que veas tu pedido en el mapa."
          poner NSCameraUsageDescription "ZIPPYGO usa la camara para que puedas tomarle foto a los productos de tu negocio."
          poner NSPhotoLibraryUsageDescription "ZIPPYGO accede a tus fotos para que elijas las imagenes de tus productos."
          echo "--- Info.plist resultante ---"
          /usr/libexec/PlistBuddy -c "Print" Info.plist | head -40

      - name: Preparar el certificado y el perfil de firma
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          CERT="$RUNNER_TEMP/dist.p12"
          PROFILE="$RUNNER_TEMP/perfil.mobileprovision"
          LLAVERO="$RUNNER_TEMP/build.keychain"
          CLAVE_LLAVERO="$(uuidgen)"

          echo "$P12_BASE64"     | base64 --decode > "$CERT"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"

          # Llavero temporal solo para este build
          security create-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          security set-keychain-settings -lut 21600 "$LLAVERO"
          security unlock-keychain -p "$CLAVE_LLAVERO" "$LLAVERO"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$LLAVERO"
          security set-key-partition-list -S apple-tool:,apple: -k "$CLAVE_LLAVERO" "$LLAVERO" >/dev/null
          security list-keychain -d user -s "$LLAVERO" login.keychain-db

          # Instalar el perfil donde Xcode lo busca
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          NOMBRE=$(security cms -D -i "$PROFILE" | plutil -extract Name raw -)
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PERFIL_NOMBRE=$NOMBRE" >> "$GITHUB_ENV"
          echo "Perfil instalado: $NOMBRE ($UUID)"

      - name: Compilar el archivo firmado
        working-directory: frontend/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          if [ -d App.xcworkspace ]; then
            CONTENEDOR=(-workspace App.xcworkspace)
          else
            CONTENEDOR=(-project App.xcodeproj)
          fi
          echo "Compilando con: ${CONTENEDOR[@]}"
          xcodebuild archive "${CONTENEDOR[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ZIPPYGO.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PERFIL_NOMBRE" \
            MARKETING_VERSION=1.1 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Exportar el .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zippygo.app</key><string>$PERFIL_NOMBRE</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZIPPYGO.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/salida" \
            -allowProvisioningUpdates

      - name: Subir a TestFlight
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -e
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP/salida"/*.ipa | head -1)
          echo "Subiendo $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Guardar el .ipa por si acaso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zippygo-ipa
          path: ${{ runner.temp }}/salida/*.ipa
          retention-days: 30
          if-no-files-found: ignore

      - name: Limpiar las llaves del runner
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/perfil.mobileprovision"
          rm -rf "$HOME/.appstoreconnect/private_keys"
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
